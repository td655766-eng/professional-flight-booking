<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBooker USA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>✈️ SkyBooker USA</h1>
</header>

<!-- HERO -->
<section class="hero">
    <h2>Book Flights Across the USA</h2>
    <p>Fast • Easy • Secure</p>
</section>

<!-- SEARCH -->
<section class="search-box">
    <input type="text" id="from" placeholder="From (New York)">
    <input type="text" id="to" placeholder="To (Los Angeles)">
    <input type="date" id="date">
    <button id="searchBtn">Search Flights</button>
    <p id="searchStatus" class="status"></p>
</section>

<!-- RESULTS -->
<section id="results"></section>

<!-- HISTORY -->
<section id="history" class="card">
    <h2>Your Bookings</h2>
    <div id="historyList"></div>
</section>

<script src="script.js"></script>
</body>
</html>
