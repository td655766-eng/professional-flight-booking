<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBooker USA — Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>✈️ SkyBooker USA</h1>
</header>
<section class="hero">
    <h2>Passenger Details</h2>
    <p>Confirm your flight and passenger information before payment.</p>
</section>
<section class="card">
    <div id="bookingInfo"></div>
    <input type="text" id="name" placeholder="Full Name">
    <div class="error" id="err-name"></div>
    <input type="email" id="email" placeholder="Email">
    <div class="error" id="err-email"></div>
    <button id="continueBtn">Continue to Payment</button>
</section>
<script src="script.js"></script>
</body>
</html>
